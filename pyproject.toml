[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zpp-traffic-control"
version = "0.1.0"
description = "Gymnasium environments for traffic signal control with CityFlow, SUMO, and MOSS backends"
readme = "README.md"
license = {text = "MIT"}
# Measured, not aspirational: the interpreter that produced every number in output/ is
# 3.12.13, and the repo's own standard (CLAUDE.md section 3, contract C5) is >=3.12.
requires-python = ">=3.12"
# EXACT PINS (P0.10, 2026-08-17), read off the live environment with `pip freeze` rather
# than guessed. We report differences of 5.68e-14 and treat float reduction order as
# evidence; an environment specified by lower bounds cannot support that. The full
# environment, including the transitive closure and the exact torch build, is recorded in
# requirements-frozen.txt.
#
# torch is pinned WITHOUT its local version segment on purpose: the installed build is
# 2.11.0+cu128, published on download.pytorch.org and not on PyPI, and a `+cu128` pin makes
# the project uninstallable from PyPI. Under PEP 440 a specifier carrying no local segment
# is satisfied by a version that has one, so `torch==2.11.0` is true of this environment.
dependencies = [
    "gymnasium==1.3.0",
    "numpy==2.5.1",
    # cityflow — install from vendored CityFlow/: cd CityFlow && pip install .
    "torch==2.11.0",
    "traci==1.27.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
viz = [
    "matplotlib==3.11.0",
]

[tool.pytest.ini_options]
# Keep collection out of the vendored CityFlow/ tree (its pybind11 test
# suite fails to collect without its own build environment).
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["rewards"]

[tool.setuptools.packages.find]
# `offline*` added 2026-08-17 (P0.10). Without it a clean `pip install .` shipped the
# PLATFORM and not the RESEARCH CODE: offline/dataset.py, offline/dt_gate.py,
# offline/offline_baselines.py, offline/method_tier_grid.py, offline/mixture_tiers.py and
# offline/transfer_gate.py were absent from the wheel, and every number in the paper comes
# from those. Editable mode hid it — the editable finder's MAPPING had no `offline` key
# either, and the test suite only resolves `offline` because tests/ carries an __init__.py,
# which makes pytest prepend the repository root to sys.path.
# `tests*` is deliberately NOT here: it is a package, and it is not a distributable one.
# tests/test_packaging.py fails if any other top-level package goes missing from this list.
include = [
    "agent*",
    "algorithms*",
    "envs*",
    "experiments*",
    "metrics*",
    "offline*",
    "states*",
    "utils*",
]
