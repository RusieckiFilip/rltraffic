# CI for rltraffic -- P0.10 (BRIEF_23).
#
# WHAT A GREEN TICK HERE MEANS, AND WHAT IT DOES NOT
# A clean runner has no corpus (datasets*/ is gitignored and ~189 MB), no SUMO and no
# built CityFlow, so a plain "pytest passed" would mean *what could run, ran*.  That is why
# every step below funnels through .github/ci/ci_gate.py: the counts are printed as part of
# the result, the skip count is checked against a DECLARED ceiling in
# .github/ci/ci_baseline.json, and exceeding that ceiling fails the job.
#
# THE GUARDS ARE NOT EXPECTED TO EXIT 0.
# scripts/check_test_hygiene.sh exits 1 on 16 pre-existing findings (DEFERRED 45) and
# scripts/check_english.sh exits 1 on 5 (P0.9).  Those are RECORDED in the baseline file and
# only a regression against it fails the job.  Do not "fix" them to make CI green and do not
# weaken a guard: scripts/ is frozen.
#
# Every command here is one that was run locally before it was written down, and every gate
# was shown going red on synthetic input -- see docs/returns/P0.10.md.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-and-guards:
    # TWO PINNED IMAGES WITH DIFFERENT glibc (review item R2, 2026-08-17).
    # The defect P0.10 fixed was `math.erfc` differing between C libraries, and the evidence
    # for the fix is that two DIFFERENT ones now agree. A single `ubuntu-latest` made that
    # coverage an accident of what the label resolved to on the day -- and its loss would have
    # been silent, which is the definition of a check that cannot go red. `latest` is banned
    # here by `tests/test_ci_gate.py::test_the_workflow_pins_its_images_and_never_uses_latest`,
    # and the `libc-matrix` job below FAILS if the two legs ever report the same glibc.
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 40
    env:
      # DEFERRED 41: the suite can deadlock unpinned -- 8 minutes at ~0 % CPU with 35
      # threads parked in futex_do_wait.  The pin moves no outcome, only liveness, and
      # every reported run in this project states whether it was pinned.
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and its pinned dependencies
        # Editable, like a developer's tree, so `offline` resolves through the packaging
        # fix rather than through pytest's rootdir insertion.  Nothing is upgraded here:
        # pyproject.toml carries exact pins measured from the environment that produced the
        # merged numbers (see requirements-frozen.txt, which is a record of that
        # environment rather than an installer input).
        run: python -m pip install -e ".[dev]"

      - name: Prepare artifact directory
        run: mkdir -p artifacts

      - name: Record this leg's C library
        # platform.libc_ver() is the property under test: it is what differs between the
        # machines whose disagreement started this. Recorded per leg and compared in a
        # separate job, because one leg cannot see another's value.
        run: |
          python - <<'PY' > artifacts/libc-${{ matrix.image }}.json
          import json, platform
          print(json.dumps({"image": "${{ matrix.image }}", "libc": list(platform.libc_ver()),
                            "platform": platform.platform()}))
          PY
          cat artifacts/libc-${{ matrix.image }}.json

      - name: Run the pinned test suite
        # -rs so every skip states its reason; --junit-xml so the gate can count the run a
        # second time by a route that shares no code with the terminal parser.
        run: |
          set -o pipefail
          python -m pytest -q -rs --junit-xml=artifacts/junit.xml | tee artifacts/pytest.txt

      - name: Gate - counts, cross-check and skip ceiling
        if: always()
        run: |
          python .github/ci/ci_gate.py pytest-gate \
            --terminal artifacts/pytest.txt \
            --junit artifacts/junit.xml \
            --baseline .github/ci/ci_baseline.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Guard 1 of 3 - frozen files
        if: always()
        # VACUOUS ON A RUNNER, AND SAID SO OUT LOUD: the guard reads `git status
        # --porcelain`, which is clean on a fresh checkout, so this can only pass.  It is
        # invoked because its absence would be worse, not because it proves anything here.
        # A PR-diff variant is a NEW enforcement mechanism and needs its own authorisation
        # (coordinator ruling 2026-08-17); it is parked as a DEFERRED row.
        run: bash scripts/claude_guard.sh --frozen-only

      - name: Guard 2 of 3 - English only
        if: always()
        # `code=$?` is taken immediately after the redirect and never after a pipe: reading
        # `$?` at the end of a pipeline gives the LAST element's status, which is exactly
        # how a guard's own count was misreported twice in this project (DEFERRED 45).
        run: |
          set +e
          bash scripts/check_english.sh > artifacts/english.out 2>&1
          code=$?
          set -e
          python .github/ci/ci_gate.py guard-gate \
            --name english \
            --output artifacts/english.out \
            --guard-exit "$code" \
            --baseline .github/ci/ci_baseline.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Guard 3 of 3 - test hygiene
        if: always()
        run: |
          set +e
          bash scripts/check_test_hygiene.sh > artifacts/hygiene.out 2>&1
          code=$?
          set -e
          python .github/ci/ci_gate.py guard-gate \
            --name hygiene \
            --output artifacts/hygiene.out \
            --guard-exit "$code" \
            --baseline .github/ci/ci_baseline.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Gate - the wheel ships the research code
        if: always()
        # P0.10's own defect, mechanised: `offline*` was missing from
        # [tool.setuptools.packages.find], so `pip install .` shipped the platform and not
        # the code every number in the paper comes from.
        run: |
          python -m pip wheel . --no-deps --wheel-dir artifacts/wheel
          python .github/ci/ci_gate.py wheel-gate \
            --wheel "$(ls artifacts/wheel/zpp_traffic_control-*.whl)" \
            --repo-root . \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload the run's artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ matrix.image }}
          path: |
            artifacts/pytest.txt
            artifacts/junit.xml
            artifacts/english.out
            artifacts/hygiene.out
            artifacts/libc-${{ matrix.image }}.json
          if-no-files-found: warn

  libc-matrix:
    # THE ASSERTION THAT MAKES THE MATRIX EVIDENCE RATHER THAN DECORATION.
    # Fails if the legs collapse onto one C library, or if a leg reports none.
    needs: suite-and-guards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect every leg's C library report
        uses: actions/download-artifact@v4
        with:
          pattern: ci-artifacts-*
          path: legs

      - name: Gate - the matrix really spans two C libraries
        run: |
          python .github/ci/ci_gate.py libc-matrix \
            --inputs legs \
            --summary-file "$GITHUB_STEP_SUMMARY"
